<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Real Estate Semantic Search (demo)</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 20px; }
  #q { width: 100%; font-size: 16px; padding: 10px; box-sizing: border-box; }
  .result { border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin-top: 12px; }
  .result h3 { margin: 0 0 4px; font-size: 15px; }
  .meta { color: #555; font-size: 13px; margin-bottom: 6px; }
  .score { color: #888; font-size: 12px; }
  .desc { font-size: 13px; color: #333; max-height: 4.5em; overflow: hidden; }
  #status { color: #888; font-size: 13px; margin-top: 8px; }
  #strict-label { display: block; font-size: 13px; color: #333; margin-top: 8px; }
  #search-help { color: #555; font-size: 13px; line-height: 1.5; margin: 6px 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .badge { border-radius: 12px; padding: 3px 8px; font-size: 12px; }
  .exact .badge { background: #e7f4ec; color: #21623b; }
  .near .badge { background: #fff2d6; color: #7a4b00; }
</style>
</head>
<body>
  <h1>Real estate semantic search (demo)</h1>
  <input id="q" type="text" placeholder="e.g. apartament luminos, 2 camere, buget maxim 150000 euro" autofocus>
  <label id="strict-label"><input id="strict" type="checkbox" aria-describedby="search-help"> Strict filtering (exact matches only)</label>
  <p id="search-help">Exact matches appear first. Unless strict filtering is on, empty slots are filled with labelled near-misses: up to 15% over budget or in neighbouring sectors. Room and subway limits stay exact.</p>
  <div id="status" role="status" aria-live="polite"></div>
  <div id="results"></div>

<script>
const q = document.getElementById("q");
const strictEl = document.getElementById("strict");
const statusEl = document.getElementById("status");
const resultsEl = document.getElementById("results");
let timer = null;

q.addEventListener("input", () => {
  clearTimeout(timer);
  timer = setTimeout(runSearch, 400);
});
strictEl.addEventListener("change", runSearch);

async function runSearch() {
  const query = q.value.trim();
  resultsEl.innerHTML = "";
  if (!query) { statusEl.textContent = ""; return; }

  statusEl.textContent = "Searching...";
  try {
    const res = await fetch(`/api/search?q=${encodeURIComponent(query)}&limit=3&strict=${strictEl.checked}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const listings = await res.json();
    statusEl.textContent = `${listings.length} result(s)`;
    resultsEl.innerHTML = listings.map(renderResult).join("");
  } catch (err) {
    statusEl.textContent = `Error: ${err.message}`;
  }
}

function renderResult(r) {
  const labels = r.is_exact_match ? ["Exact match"] : ["Near match", ...r.match_labels];
  return `
    <div class="result ${r.is_exact_match ? "exact" : "near"}">
      <div class="badges">${labels.map(label => `<span class="badge">${escapeHtml(label)}</span>`).join("")}</div>
      <h3>${escapeHtml(r.title)}</h3>
      <div class="meta">${r.price_eur.toLocaleString()} EUR · ${r.rooms ?? "?"} rooms · ${r.built_area_sqm ?? "?"} m² · sector ${r.sector ?? "?"} · ${escapeHtml(r.address_text)}</div>
      <div class="score">similarity: ${r.score.toFixed(3)}</div>
      <div class="desc">${escapeHtml(r.description)}</div>
    </div>`;
}

function escapeHtml(s) {
  const div = document.createElement("div");
  div.textContent = s ?? "";
  return div.innerHTML;
}
</script>
</body>
</html>
